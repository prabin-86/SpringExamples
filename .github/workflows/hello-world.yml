name: Multi-Job Artifact Pipeline

on:
  push:
    branches: [ "main" ]
  # 👇 ADD THIS LINE to enable the manual "Run workflow" button in the UI
  workflow_dispatch: 

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create a build file
        run: echo "Compiled assets from build number ${{ github.run_number }}" > build.txt
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-compiled-assets
          path: build.txt

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: my-compiled-assets
      - name: Read the asset file
        run: cat build.txt
      - name: Force failure
        run: exit 1
