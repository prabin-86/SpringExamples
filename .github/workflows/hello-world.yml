name: Multi-Job Sequential Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Run successful step
        run: echo "Job 1 completed successfully!"

  second-job:
    runs-on: ubuntu-latest
    # 👇 ADD THIS LINE to link the two jobs together sequentially
    needs: first-job 
    steps:
      - name: Run failing step
        run: |
          echo "Job 2 is executing..."
          exit 1
